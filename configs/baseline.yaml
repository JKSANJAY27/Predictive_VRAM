# Runtime Baseline Configuration for Distributed Split Inference
model:
  identifier: "gpt2"
  device: "cpu"
  dtype: "float32"

generation:
  prompt: "The future of distributed edge computing and predictive resource allocation"
  max_new_tokens: 16
  temperature: 0.0
  do_sample: false
  seed: 42

tiers:
  user_device:
    name: "User Device (Mobile/IoT)"
    device: "cpu"
  edge_a:
    name: "Edge Node A (Local Aggregator)"
    device: "cpu"
  edge_b:
    name: "Edge Node B (Regional Edge Server)"
    device: "cpu"

# Supported static partition schemes for 12-layer model:
partitions:
  three_tier:
    description: "Even distribution across User Device, Edge A, and Edge B"
    user_device: [0, 3]    # Layers 0, 1, 2, 3 (4 layers)
    edge_a: [4, 7]         # Layers 4, 5, 6, 7 (4 layers)
    edge_b: [8, 11]        # Layers 8, 9, 10, 11 (4 layers)

  two_tier:
    description: "Partitioned across User Device and Edge A"
    user_device: [0, 5]    # Layers 0..5 (6 layers)
    edge_a: [6, 11]        # Layers 6..11 (6 layers)
    edge_b: null

  monolithic_local:
    description: "All layers executed on User Device"
    user_device: [0, 11]   # Layers 0..11 (12 layers)
    edge_a: null
    edge_b: null

# Predictive VRAM and Network Forecasting Configuration (Module 4)
prediction:
  enabled: true
  horizon_seconds: 2.0
  step_interval_seconds: 0.2
  predictor:
    type: "linear_trend"
    minimum_history: 4
    targets:
      - "bandwidth_mbps"
      - "latency_ms"
      - "vram_free_mb"
      - "kv_cache_bytes"
  evaluation:
    metrics:
      - "mae"
      - "rmse"

# Cost Model and Candidate Scoring Configuration (Module 6)
cost:
  weights:
    latency: 1.0          # alpha
    communication: 0.2    # beta
    memory_pressure: 1.0  # gamma
    energy: 0.1           # delta
    switching: 1.0        # epsilon

  normalization:
    latency_scale_ms: 100.0
    communication_scale_mb: 10.0
    memory_pressure_scale: 1.0
    energy_scale_j: 10.0
    switching_scale: 1.0

  switching:
    per_layer_cost: 0.1
    boundary_shift_cost: 0.2
    kv_transfer_cost_per_mb: 0.05
    tier_disruption_cost: 0.5

  memory:
    safety_margin_mb: 256.0
    risk_threshold_ratio: 0.85

  energy:
    power_proxies_watts:
      user_device: 5.0
      edge_a: 45.0
      edge_b: 150.0

